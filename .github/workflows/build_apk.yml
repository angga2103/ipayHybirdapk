name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-cache Gradle Wrapper
        run: |
          chmod +x android/gradlew
          TARGET="$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin/23ovyewtku6u96viwx3xl3oks"
          mkdir -p "$TARGET"
          if [ ! -d "$TARGET/gradle-9.3.1" ] || [ ! -f "$TARGET/gradle-9.3.1-bin.zip.ok" ]; then
            echo "Pre-downloading Gradle 9.3.1-bin wrapper..."
            curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -m 300 -f "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o "$TARGET/gradle-9.3.1-bin.zip" || \
            curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -m 300 -f "https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip" -o "$TARGET/gradle-9.3.1-bin.zip" || \
            curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -m 300 -f "https://downloads.gradle-dn.com/distributions/gradle-9.3.1-bin.zip" -o "$TARGET/gradle-9.3.1-bin.zip"
            if [ -f "$TARGET/gradle-9.3.1-bin.zip" ]; then
              echo "Extracting Gradle wrapper distribution..."
              unzip -q -o "$TARGET/gradle-9.3.1-bin.zip" -d "$TARGET"
              touch "$TARGET/gradle-9.3.1-bin.zip.ok"
              echo "Gradle wrapper ready at $TARGET:"
              ls -la "$TARGET"
            fi
          fi
          cd android && ./gradlew --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1 || BUILD_FAILED=1
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "Build attempt 1 encountered an issue (e.g. network download timeout), retrying..."
            sleep 5
            BUILD_FAILED=0
            flutter build apk --release --no-tree-shake-icons > build.log 2>&1 || BUILD_FAILED=1
          fi
          if [ "$BUILD_FAILED" = "1" ]; then
            tail -n 150 build.log > build_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B debug-log
            git add build_error.txt
            git commit -m "ci: capture build error log"
            git push origin debug-log --force
            cat build_error.txt
            exit 1
          fi

      - name: Prepare Release APK Files
        id: vars
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-release.apk release-files/IPAY-release.apk
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v$VERSION"
          fi
          
          cp build/app/outputs/flutter-apk/app-release.apk release-files/IPAY-${TAG_NAME}.apk
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GarudaTel iPay Mobile POS ${{ steps.vars.outputs.tag }}"
          body: |
            ## 📱 GarudaTel iPay - Mobile POS (${{ steps.vars.outputs.tag }})

            Aplikasi Android Native Hybrid resmi untuk **GarudaTel iPay (https://ipay.my.id)** dengan integrasi hardware kasir offline-first dan sistem POS mandiri.

            ### 🌟 Fitur Baru di Versi ${{ steps.vars.outputs.tag }}:
            - **Sistem Kasir POS Offline-First (Penyimpanan Memori HP)**:
              - Database lokal SQLite cepat, aman, dan tanpa perlu kuota/internet.
              - Akses instan dari tombol kasir utama di bilah navigasi bawah.
              - Pencarian produk kilat dengan filter kategori dan barcode tanpa lag.
              - **Harga Jual Dinamis di Kasir**: Kasir dapat mengubah harga saat transaksi (untuk diskon manual/grosir) dilengkapi peringatan jika di bawah modal, serta riwayat audit lengkap.
            - **Manajemen Produk & Excel**:
              - Import & Export produk mudah via file Excel (.xlsx) dengan 8 kolom standar (`KODE`, `NAMA PRODUK`, `UNIT`, `HARGA DASAR`, `HARGA JUAL`, `BERAT`, `STOK`, `KATEGORI`) + info `PENITIP`.
              - Download template Excel contoh langsung dari HP.
            - **Sistem Konsinyasi (Titip Jual) & Laporan Bagi Hasil**:
              - Pencatatan stok barang titipan dan pemilik barang.
              - Pembagian bagi hasil dan cetak struk penyelesaian konsinyasi ke printer thermal.
            - **Bluetooth Thermal POS Printer 58mm & 80mm**:
              - Format 2 kolom presisi rata kiri-kanan otomatis.
              - Cetak logo toko raster hitam-putih presisi dan jernih.
              - Mode hemat kertas (paper-saving 1 baris feed).
              - Tes koneksi & sambung printer via nama atau MAC Address manual.

            ---
            ### 📥 Download File APK:
            Unduh langsung file `.apk` di bagian **Assets** di bawah:
            - 🔹 **IPAY-release.apk** (Versi rilis universal terbaru)
            - 🔹 **IPAY-${{ steps.vars.outputs.tag }}.apk** (Versi rilis ${{ steps.vars.outputs.tag }})
          files: |
            release-files/IPAY-release.apk
            release-files/IPAY-${{ steps.vars.outputs.tag }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
